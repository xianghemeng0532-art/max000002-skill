<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Skills Catalog</title>
<style>
:root {
  --bg: #f5f5f7;
  --bg-card: rgba(255,255,255,0.72);
  --bg-card-hover: rgba(255,255,255,0.92);
  --text: #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary: #6e6e73;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 4px 24px rgba(0,0,0,0.06);
  --shadow-hover: 0 12px 40px rgba(0,0,0,0.12);
  --glass: blur(20px) saturate(180%);
  --gradient-1: #667eea;
  --gradient-2: #764ba2;
  --gradient-3: #f093fb;
  --gradient-4: #4facfe;
  --tag-research: #ff6b6b;
  --tag-dev: #51cf66;
  --tag-video: #339af0;
  --tag-writing: #fcc419;
  --tag-tool: #845ef7;
  --tag-science: #20c997;
  --tag-other: #868e96;
  --modal-bg: rgba(255,255,255,0.96);
  --card-radius: 16px;
  --transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
[data-theme="dark"] {
  --bg: #000;
  --bg-card: rgba(28,28,30,0.72);
  --bg-card-hover: rgba(44,44,46,0.92);
  --text: #f5f5f7;
  --text-secondary: #98989d;
  --text-tertiary: #86868b;
  --border: rgba(255,255,255,0.12);
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-hover: 0 12px 40px rgba(0,0,0,0.5);
  --modal-bg: rgba(28,28,30,0.98);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
#particleCanvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1; pointer-events: none;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: transparent;
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}
html { background: var(--bg); transition: background var(--transition); }
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(102,126,234,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 60%, rgba(244,114,182,0.03) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(79,172,254,0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: -2;
  transition: opacity var(--transition);
}
[data-theme="dark"] body::before { opacity: 0.25; }

.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

.header {
  text-align: center;
  padding: 80px 0 40px;
  animation: fadeInUp 0.8s ease;
}
.header-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
  border-radius: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 36px;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(102,126,234,0.3);
}
.header h1 {
  font-size: 48px; font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #1d1d1f 0%, #1d1d1f 60%, #636366 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
[data-theme="dark"] .header h1 {
  background: linear-gradient(135deg, #f5f5f7 0%, #f5f5f7 60%, #98989d 100%);
  -webkit-background-clip: text;
}
.header p {
  font-size: 20px; color: var(--text-secondary);
  font-weight: 400; max-width: 600px; margin: 0 auto;
}

.stats-bar {
  display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
  padding: 20px 0 40px;
  animation: fadeInUp 0.8s ease 0.15s both;
}
.stat {
  background: var(--bg-card); backdrop-filter: var(--glass);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 16px 28px;
  text-align: center;
  transition: all var(--transition);
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-num { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.stat:nth-child(1) .stat-num { color: #667eea; }
.stat:nth-child(2) .stat-num { color: #4facfe; }
.stat:nth-child(3) .stat-num { color: #f093fb; }
.stat:nth-child(4) .stat-num { color: #20c997; }
.stat:nth-child(5) .stat-num { color: #fcc419; }

.controls {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  margin-bottom: 24px; position: sticky; top: 16px; z-index: 100;
  animation: fadeInUp 0.8s ease 0.3s both;
}
.search-wrap {
  flex: 1; min-width: 200px; position: relative;
}
.search-wrap input {
  width: 100%; padding: 14px 20px 14px 48px;
  border-radius: 100px; border: 1px solid var(--border);
  background: var(--bg-card); backdrop-filter: var(--glass);
  font-size: 16px; color: var(--text);
  transition: all var(--transition);
  outline: none;
}
.search-wrap input:focus { box-shadow: 0 0 0 4px rgba(0,113,227,0.15); border-color: var(--accent); }
.search-icon {
  position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
  color: var(--text-tertiary); font-size: 18px;
}
.theme-toggle {
  width: 44px; height: 44px; border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--bg-card); backdrop-filter: var(--glass);
  cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.theme-toggle:hover { box-shadow: var(--shadow); }

.categories {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px;
  animation: fadeInUp 0.8s ease 0.4s both;
}
.cat-btn {
  padding: 8px 18px; border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--bg-card); backdrop-filter: var(--glass);
  cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition);
  white-space: nowrap;
}
.cat-btn:hover { color: var(--text); border-color: var(--accent); }
.cat-btn.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.cat-count { font-size: 11px; opacity: 0.7; }

.skills-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px; margin-bottom: 60px;
}
.skill-card {
  background: var(--bg-card); backdrop-filter: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: 20px 24px;
  cursor: pointer;
  transition: all var(--transition);
  animation: fadeInUp 0.6s ease both;
  position: relative; overflow: hidden;
}
.skill-card::before {
  content: ''; position: absolute; inset: 0;
  border-radius: var(--card-radius);
  opacity: 0; transition: opacity var(--transition);
  z-index: 0;
}
.skill-card:hover::before { opacity: 1; }
.skill-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  background: var(--bg-card-hover);
}
.skill-card:active { transform: scale(0.98); }
.skill-card > * { position: relative; z-index: 1; }
.skill-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 8px;
}
.skill-name {
  font-size: 16px; font-weight: 600;
  letter-spacing: -0.2px;
}
.skill-tag {
  font-size: 11px; font-weight: 500; padding: 3px 10px;
  border-radius: 100px; white-space: nowrap;
  letter-spacing: 0.3px;
}
.tag-research { background: rgba(255,107,107,0.12); color: #ff6b6b; }
.tag-dev { background: rgba(81,207,102,0.12); color: #40c057; }
.tag-video { background: rgba(51,154,240,0.12); color: #339af0; }
.tag-writing { background: rgba(252,196,25,0.12); color: #e6a800; }
.tag-tool { background: rgba(132,94,247,0.12); color: #7950f2; }
.tag-science { background: rgba(32,201,151,0.12); color: #12b886; }
.tag-other { background: rgba(134,142,150,0.12); color: #868e96; }
.skill-desc {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.5; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.skill-invoke {
  margin-top: 10px; font-size: 12px; color: var(--text-tertiary);
  font-family: 'SF Mono', 'Fira Code', monospace;
  background: rgba(0,0,0,0.04); border-radius: 6px;
  padding: 4px 8px; display: inline-block;
}
[data-theme="dark"] .skill-invoke { background: rgba(255,255,255,0.06); }

.empty-state {
  grid-column: 1 / -1; text-align: center; padding: 60px 20px;
  color: var(--text-secondary);
  animation: fadeInUp 0.5s ease;
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }

.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
  padding: 20px;
}
.modal {
  background: var(--modal-bg); backdrop-filter: blur(40px);
  border-radius: 24px; max-width: 640px; width: 100%; max-height: 80vh;
  overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.24);
  animation: scaleIn 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.modal-header {
  padding: 28px 32px 0; display: flex; align-items: flex-start;
  justify-content: space-between; position: sticky; top: 0;
  background: var(--modal-bg); backdrop-filter: blur(40px);
  z-index: 1; border-radius: 24px 24px 0 0;
}
.modal-title { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
.modal-close {
  width: 32px; height: 32px; border-radius: 100px;
  border: none; background: rgba(128,128,128,0.15);
  cursor: pointer; font-size: 16px; display: flex;
  align-items: center; justify-content: center;
  transition: all var(--transition); color: var(--text);
  flex-shrink: 0;
}
.modal-close:hover { background: rgba(128,128,128,0.25); }
.modal-body { padding: 24px 32px 32px; }
.modal-section { margin-bottom: 20px; }
.modal-section:last-child { margin-bottom: 0; }
.modal-section h4 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-tertiary); margin-bottom: 8px; font-weight: 600;
}
.modal-section p, .modal-section li { font-size: 15px; color: var(--text-secondary); line-height: 1.7; }
.modal-section ul { padding-left: 20px; }
.modal-section code {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px; background: rgba(0,0,0,0.05);
  padding: 2px 6px; border-radius: 4px;
}
[data-theme="dark"] .modal-section code { background: rgba(255,255,255,0.1); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

.footer {
  text-align: center; padding: 40px 20px;
  color: var(--text-tertiary); font-size: 13px;
  border-top: 1px solid var(--border);
}
.footer a { color: var(--accent); text-decoration: none; }

@media (max-width: 768px) {
  .header h1 { font-size: 32px; }
  .skills-grid { grid-template-columns: 1fr; }
  .stats-bar { gap: 12px; }
  .stat { padding: 12px 18px; }
  .stat-num { font-size: 28px; }
  .controls { flex-direction: column; }
  .search-wrap { width: 100%; }
  .modal { margin: 10px; border-radius: 20px; }
  .modal-header, .modal-body { padding-left: 20px; padding-right: 20px; }
}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="container">
  <header class="header">
    <div class="header-icon">&#x2699;</div>
    <h1>Claude Code Skills</h1>
    <p>完整的可交互技能目录 — 浏览、搜索、了解每个技能的用法</p>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" id="searchInput" placeholder="搜索技能名称、描述、用途...">
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换深色模式">&#x263E;</button>
  </div>

  <div class="categories" id="categoryFilters"></div>
  <div class="skills-grid" id="skillsGrid"></div>

  <footer class="footer">
    Claude Code Skills Catalog · 共 <span id="totalCount">0</span> 个技能 · 生成于 2026-05-24
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const skills = [
  // ===== ACADEMIC RESEARCH =====
  {

    invoke: "/academic-paper",
    modes: "full / plan / outline / revision / revision-coach / abstract / lit-review / format-convert / citation-check / disclosure"

    usage: "规划研究项目、系统化文献调研、实验设计辅助",

  {
    name: "dispatching-parallel-agents",

  {

    desc: "完成任务、实现重要功能或合并前，请求代码审查以验证工作是否满足需求。",
    usage: "功能完成、准备合并时",
    solve: "提交前进行系统化自审，减少 PR 往返修改",
    invoke: "/requesting-code-review"
  },
  {
    name: "receiving-code-review",
    category: "superpowers",
    tag: "dev",
    tagLabel: "开发工作流",
    desc: "收到代码审查反馈时，先进行技术严谨性检查，再实施建议。避免盲目接受。",

  {

    tag: "dev",

let currentTheme = 'light';
let activeCategory = 'all';
let searchQuery = '';

const categoryMap = {
  all: { label: '全部', count: skills.length },
  academic: { label: '学术研究', count: 0 },
  superpowers: { label: '开发工作流', count: 0 },

skills.forEach(s => {

function renderStats() {
  const total = skills.length;
  const academic = skills.filter(s => s.category === 'academic').length;
  const superpowers = skills.filter(s => s.category === 'superpowers').length;
  const hyperframes = skills.filter(s => s.category === 'hyperframes').length;
  const scientific = skills.filter(s => s.category === 'scientific').length;
  const preexisting = skills.filter(s => s.category === 'preexisting').length;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">技能总数</div></div>
    <div class="stat"><div class="stat-num">${scientific}</div><div class="stat-label">科研计算</div></div>
    <div class="stat"><div class="stat-num">${academic + superpowers}</div><div class="stat-label">学术 + 工作流</div></div>
    <div class="stat"><div class="stat-num">${hyperframes}</div><div class="stat-label">视频制作</div></div>
    <div class="stat"><div class="stat-num">${preexisting}</div><div class="stat-label">中文 / 工具</div></div>
  `;
  document.getElementById('totalCount').textContent = total;
}

function renderCategories() {
  const html = Object.entries(categoryMap).map(([key, val]) =>
    `<button class="cat-btn${activeCategory===key?' active':''}" onclick="filterCategory('${key}')">
      ${val.label} <span class="cat-count">${val.count}</span>
    </button>`
  ).join('');
  document.getElementById('categoryFilters').innerHTML = html;
}

function getFilteredSkills() {
  return skills.filter(s => {
    const catMatch = activeCategory === 'all' || s.category === activeCategory;
    const q = searchQuery.toLowerCase();
    const searchMatch = !q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || (s.usage||'').toLowerCase().includes(q) || (s.solve||'').toLowerCase().includes(q);
    return catMatch && searchMatch;
  });
}

function renderSkills() {
  const filtered = getFilteredSkills();
  const grid = document.getElementById('skillsGrid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">&#x1F50E;</div>
      <h3>没有找到匹配的技能</h3>
      <p>尝试不同的搜索词或切换分类</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map((s, i) =>
    `<div class="skill-card" style="animation-delay:${i*0.02}s" onclick="openModal('${s.name}')">
      <div class="skill-header">
        <span class="skill-name">${s.name}</span>
        <span class="skill-tag tag-${s.tag}">${s.tagLabel}</span>
      </div>
      <div class="skill-desc">${s.desc}</div>
      <div class="skill-invoke">${s.invoke}</div>
    </div>`
  ).join('');
}

function filterCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderSkills();
}

function openModal(name) {
  const s = skills.find(x => x.name === name);
  if (!s) return;

  let html = `
    <div class="modal-header">
      <span class="modal-title">${s.name}</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <span class="skill-tag tag-${s.tag}" style="margin-bottom:12px;display:inline-block;">${s.tagLabel}</span>
        <p style="margin-top:8px;">${s.desc}</p>
      </div>
      <div class="modal-section">
        <h4>调用方式</h4>
        <p><code>${s.invoke}</code></p>
        ${s.triggers ? `<p style="margin-top:8px;"><strong>触发词：</strong>${s.triggers}</p>` : ''}
        ${s.modes ? `<p style="margin-top:8px;"><strong>可用模式：</strong>${s.modes}</p>` : ''}
      </div>
      <div class="modal-section">
        <h4>使用场景</h4>
        <p>${s.usage}</p>
      </div>
      <div class="modal-section">
        <h4>解决的问题</h4>
        <p>${s.solve}</p>
      </div>
    </div>`;

  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.body.style.overflow = '';
}

function toggleTheme() {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('themeToggle').textContent = currentTheme === 'light' ? '☾' : '☀';
  localStorage.setItem('skills-catalog-theme', currentTheme);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('skills-catalog-theme');
  if (saved === 'dark') {
    currentTheme = 'dark';
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeToggle').textContent = '☀';
  }
  renderStats();
  renderCategories();
  renderSkills();

  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderSkills();
  });
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });
});

<script>
// ===== PARTICLE SYSTEM =====
(function() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let sparkles = [];
  let mouse = { x: -1000, y: -1000, r: 150 };
  let w, h;
  const PARTICLE_COUNT = 130;
  const CONNECTION_DIST = 160;
  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);

  class Particle {
    constructor() {
      this.reset();
      this.y = Math.random() * h; // start anywhere
      this.x = Math.random() * w;
    }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
      this.r = Math.random() * 2.5 + 1;
      this.opacity = Math.random() * 0.5 + 0.15;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = (Math.random() - 0.5) * 0.01;
      this.wobbleAmp = Math.random() * 0.4;
      this.hue = [220, 260, 290, 330][Math.floor(Math.random() * 4)]; // blue, purple, pink
    }
    update() {
      this.wobble += this.wobbleSpeed;
      this.x += this.vx + Math.sin(this.wobble) * this.wobbleAmp;
      this.y += this.vy + Math.cos(this.wobble * 0.7) * this.wobbleAmp;

      // Mouse repulsion / attraction
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouse.r) {
        const force = (mouse.r - dist) / mouse.r;
        const angle = Math.atan2(dy, dx);
        this.x -= Math.cos(angle) * force * 1.2;
        this.y -= Math.sin(angle) * force * 1.2;
      }

      // Wrap around edges
      if (this.x < -20) this.x = w + 20;
      if (this.x > w + 20) this.x = -20;
      if (this.y < -20) this.y = h + 20;
      if (this.y > h + 20) this.y = -20;
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      const alpha = isDark() ? this.opacity * 0.7 : this.opacity;
      ctx.fillStyle = `hsla(${this.hue}, 60%, ${isDark() ? 70 : 50}%, ${alpha})`;
      ctx.fill();
    }
  }

  function init() {
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle());
    }
  }

  function drawConnections() {
    const alpha = isDark() ? 0.06 : 0.08;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECTION_DIST) {
          const opacity = (1 - dist / CONNECTION_DIST) * alpha;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(${isDark() ? '180,180,220' : '120,130,200'}, ${opacity})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  class ShockRing {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.r = 2; this.maxR = 80 + Math.random() * 40;
      this.life = 1; this.decay = 0.025;
    }
    update() { this.r += (this.maxR - this.r) * 0.15; this.life -= this.decay; }
    draw(ctx) {
      const alpha = this.life * 0.3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${isDark() ? '180,160,240' : '140,120,210'}, ${alpha})`;
      ctx.lineWidth = 1.5 * this.life;
      ctx.stroke();
    }
    get dead() { return this.life <= 0; }
  }

  let shockRings = [];

  class Sparkle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.r = Math.random() * 3 + 1.5;
      this.life = 1;
      this.decay = Math.random() * 0.015 + 0.008;
      this.hue = [200, 240, 280, 320, 340][Math.floor(Math.random() * 5)];
      this.gravity = 0.04;
      this.friction = 0.98;
    }
    update() {
      this.vx *= this.friction;
      this.vy *= this.friction;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.r *= 0.995;
    }
    draw(ctx) {
      const alpha = this.life * 0.8;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 80%, ${isDark() ? 75 : 55}%, ${alpha})`;
      ctx.fill();
      // Outer glow
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 70%, ${isDark() ? 70 : 50}%, ${alpha * 0.15})`;
      ctx.fill();
    }
    get dead() { return this.life <= 0; }
  }

  function spawnExplosion(x, y, count) {
    for (let i = 0; i < count; i++) {
      sparkles.push(new Sparkle(x, y));
    }
    shockRings.push(new ShockRing(x, y));
  }

  function drawMouseGlow() {
    if (mouse.x < -500) return;
    const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, mouse.r);
    const hue = isDark() ? '160,180,255' : '120,130,220';
    gradient.addColorStop(0, `rgba(${hue}, 0.06)`);
    gradient.addColorStop(0.5, `rgba(${hue}, 0.03)`);
    gradient.addColorStop(1, `rgba(${hue}, 0)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(mouse.x - mouse.r, mouse.y - mouse.r, mouse.r * 2, mouse.r * 2);
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    drawMouseGlow();
    drawConnections();
    particles.forEach(p => { p.update(); p.draw(ctx); });
    sparkles.forEach(s => { s.update(); s.draw(ctx); });
    shockRings.forEach(r => { r.update(); r.draw(ctx); });
    sparkles = sparkles.filter(s => !s.dead);
    shockRings = shockRings.filter(r => !r.dead);
    requestAnimationFrame(animate);
  }

  document.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  document.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });

  // Click explosion (skip interactive elements)
  document.addEventListener('click', e => {
    if (e.target.closest('.skill-card, .cat-btn, button, input, .modal-overlay')) return;
    spawnExplosion(e.clientX, e.clientY, 25 + Math.floor(Math.random() * 15));
  });

  // Touch support
  document.addEventListener('touchmove', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (e.changedTouches.length === 1 && !e.target.closest('.skill-card, .cat-btn, button, input')) {
      const t = e.changedTouches[0];
      spawnExplosion(t.clientX, t.clientY, 20);
    }
    mouse.x = -1000; mouse.y = -1000;
  });

  // Re-init particles on theme change
  const observer = new MutationObserver(() => { init(); });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  resize();
  init();
  animate();
})();
</script>
