<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Skills Catalog</title>
<style>
:root {
  --bg: #f5f5f7;
  --bg-card: rgba(255,255,255,0.72);
  --bg-card-hover: rgba(255,255,255,0.92);
  --text: #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary: #6e6e73;
  --accent: #0071e3;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 4px 24px rgba(0,0,0,0.06);
  --shadow-hover: 0 12px 40px rgba(0,0,0,0.12);
  --glass: blur(20px) saturate(180%);
  --modal-bg: rgba(255,255,255,0.96);
  --card-radius: 16px;
  --transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
[data-theme="dark"] {
  --bg: #000;
  --bg-card: rgba(28,28,30,0.72);
  --bg-card-hover: rgba(44,44,46,0.92);
  --text: #f5f5f7;
  --text-secondary: #98989d;
  --text-tertiary: #86868b;
  --border: rgba(255,255,255,0.12);
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-hover: 0 12px 40px rgba(0,0,0,0.5);
  --modal-bg: rgba(28,28,30,0.98);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
#particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
html { background: var(--bg); transition: background var(--transition); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: transparent; color: var(--text); line-height: 1.5;
  -webkit-font-smoothing: antialiased; transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(102,126,234,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 60%, rgba(244,114,182,0.03) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(79,172,254,0.03) 0%, transparent 50%);
  pointer-events: none; z-index: -2; transition: opacity var(--transition);
}
[data-theme="dark"] body::before { opacity: 0.25; }

.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

.header { text-align: center; padding: 80px 0 40px; animation: fadeInUp 0.8s ease; }
.header-icon {
  width: 72px; height: 72px; background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 18px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(102,126,234,0.3);
}
.header h1 {
  font-size: 48px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #1d1d1f 0%, #1d1d1f 60%, #636366 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
}
[data-theme="dark"] .header h1 {
  background: linear-gradient(135deg, #f5f5f7 0%, #f5f5f7 60%, #98989d 100%);
  -webkit-background-clip: text;
}
.header p { font-size: 20px; color: var(--text-secondary); font-weight: 400; max-width: 600px; margin: 0 auto; }

.stats-bar { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; padding: 20px 0 40px; animation: fadeInUp 0.8s ease 0.15s both; }
.stat {
  background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border);
  border-radius: 20px; padding: 16px 28px; text-align: center; transition: all var(--transition);
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-num { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.stat:nth-child(1) .stat-num { color: #667eea; }
.stat:nth-child(2) .stat-num { color: #4facfe; }
.stat:nth-child(3) .stat-num { color: #f093fb; }
.stat:nth-child(4) .stat-num { color: #20c997; }
.stat:nth-child(5) .stat-num { color: #fcc419; }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; position: sticky; top: 16px; z-index: 100; animation: fadeInUp 0.8s ease 0.3s both; }
.search-wrap { flex: 1; min-width: 200px; position: relative; }
.search-wrap input {
  width: 100%; padding: 14px 20px 14px 48px; border-radius: 100px; border: 1px solid var(--border);
  background: var(--bg-card); backdrop-filter: var(--glass); font-size: 16px; color: var(--text);
  transition: all var(--transition); outline: none;
}
.search-wrap input:focus { box-shadow: 0 0 0 4px rgba(0,113,227,0.15); border-color: var(--accent); }
.search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 18px; }
.theme-toggle {
  width: 44px; height: 44px; border-radius: 100px; border: 1px solid var(--border);
  background: var(--bg-card); backdrop-filter: var(--glass); cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center; transition: all var(--transition);
}
.theme-toggle:hover { box-shadow: var(--shadow); }

.categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; animation: fadeInUp 0.8s ease 0.4s both; }
.cat-btn {
  padding: 8px 18px; border-radius: 100px; border: 1px solid var(--border);
  background: var(--bg-card); backdrop-filter: var(--glass); cursor: pointer; font-size: 13px;
  font-weight: 500; color: var(--text-secondary); transition: all var(--transition); white-space: nowrap;
}
.cat-btn:hover { color: var(--text); border-color: var(--accent); }
.cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.cat-count { font-size: 11px; opacity: 0.7; }

.skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 60px; }
.skill-card {
  background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border);
  border-radius: var(--card-radius); padding: 20px 24px; cursor: pointer; transition: all var(--transition);
  animation: fadeInUp 0.6s ease both; position: relative; overflow: hidden;
}
.skill-card::before {
  content: ''; position: absolute; inset: 0; border-radius: var(--card-radius);
  background: linear-gradient(135deg, rgba(102,126,234,0.04), rgba(244,114,182,0.04));
  opacity: 0; transition: opacity var(--transition); z-index: 0;
}
.skill-card:hover::before { opacity: 1; }
.skill-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); background: var(--bg-card-hover); }
.skill-card:active { transform: scale(0.98); }
.skill-card > * { position: relative; z-index: 1; }
.skill-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.skill-name { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
.skill-tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 100px; white-space: nowrap; letter-spacing: 0.3px; }
.tag-research { background: rgba(255,107,107,0.12); color: #ff6b6b; }
.tag-dev { background: rgba(81,207,102,0.12); color: #40c057; }
.tag-video { background: rgba(51,154,240,0.12); color: #339af0; }
.tag-writing { background: rgba(252,196,25,0.12); color: #e6a800; }
.tag-tool { background: rgba(132,94,247,0.12); color: #7950f2; }
.tag-science { background: rgba(32,201,151,0.12); color: #12b886; }
.tag-other { background: rgba(134,142,150,0.12); color: #868e96; }
.skill-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skill-invoke { margin-top: 10px; font-size: 12px; color: var(--text-tertiary); font-family: 'SF Mono', 'Fira Code', monospace; background: rgba(0,0,0,0.04); border-radius: 6px; padding: 4px 8px; display: inline-block; }
[data-theme="dark"] .skill-invoke { background: rgba(255,255,255,0.06); }

.skill-rating {
  margin-top: 10px; display: flex; align-items: center; gap: 8px;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.stars { display: flex; gap: 2px; }
.star {
  font-size: 16px; cursor: pointer; transition: all 0.15s ease;
  color: rgba(0,0,0,0.12); user-select: none;
}
[data-theme="dark"] .star { color: rgba(255,255,255,0.1); }
.star.active { color: #f5a623; }
.star:hover { transform: scale(1.25); }
.stars:hover .star { color: #f5a623; }
.stars .star:hover ~ .star { color: rgba(0,0,0,0.12); }
[data-theme="dark"] .stars .star:hover ~ .star { color: rgba(255,255,255,0.1); }

.rating-info { font-size: 12px; color: var(--text-tertiary); }
.rating-info strong { color: var(--text-secondary); font-weight: 600; }

.sort-bar {
  display: flex; gap: 8px; align-items: center; margin-bottom: 20px;
  animation: fadeInUp 0.8s ease 0.45s both; font-size: 13px; color: var(--text-secondary);
}
.sort-bar select {
  padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border);
  background: var(--bg-card); backdrop-filter: var(--glass);
  font-size: 13px; color: var(--text); outline: none; cursor: pointer;
}

.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-secondary); animation: fadeInUp 0.5s ease; }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }

.modal-overlay {
  position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.3);
  backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease; padding: 20px;
}
.modal {
  background: var(--modal-bg); backdrop-filter: blur(40px); border-radius: 24px;
  max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.24); animation: scaleIn 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.modal-header { padding: 28px 32px 0; display: flex; align-items: flex-start; justify-content: space-between; position: sticky; top: 0; background: var(--modal-bg); backdrop-filter: blur(40px); z-index: 1; border-radius: 24px 24px 0 0; }
.modal-title { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
.modal-close { width: 32px; height: 32px; border-radius: 100px; border: none; background: rgba(128,128,128,0.15); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); color: var(--text); flex-shrink: 0; }
.modal-close:hover { background: rgba(128,128,128,0.25); }
.modal-body { padding: 24px 32px 32px; }
.modal-section { margin-bottom: 20px; }
.modal-section:last-child { margin-bottom: 0; }
.modal-section h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); margin-bottom: 8px; font-weight: 600; }
.modal-section p, .modal-section li { font-size: 15px; color: var(--text-secondary); line-height: 1.7; }
.modal-section ul { padding-left: 20px; }
.modal-section code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; }
[data-theme="dark"] .modal-section code { background: rgba(255,255,255,0.1); }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

.footer { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13px; border-top: 1px solid var(--border); }

@media (max-width: 768px) {
  .header h1 { font-size: 32px; } .skills-grid { grid-template-columns: 1fr; }
  .stats-bar { gap: 12px; } .stat { padding: 12px 18px; } .stat-num { font-size: 28px; }
  .controls { flex-direction: column; } .search-wrap { width: 100%; }
  .modal { margin: 10px; border-radius: 20px; } .modal-header, .modal-body { padding-left: 20px; padding-right: 20px; }
}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="container">
  <header class="header">
    <div class="header-icon">&#x2699;</div>
    <h1>Claude Code Skills</h1>
    <p>完整的可交互技能目录 — 浏览、搜索、了解每个技能的用法</p>
  </header>
  <div class="stats-bar" id="statsBar"></div>
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" id="searchInput" placeholder="搜索技能名称、描述、用途...">
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换深色模式">&#x263E;</button>
  </div>
  <div class="categories" id="categoryFilters"></div>
  <div class="sort-bar">
    <span>排序：</span>
    <select id="sortSelect" onchange="sortSkills(this.value)">
      <option value="default">默认</option>
      <option value="rating">评分最高</option>
      <option value="votes">投票最多</option>
      <option value="name">名称 A-Z</option>
    </select>
  </div>
  <div class="skills-grid" id="skillsGrid"></div>
  <footer class="footer">Claude Code Skills Catalog · 共 <span id="totalCount">0</span> 个技能 · 生成于 2026-05-24</footer>
</div>
<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<script>
// ===== SKILL DATA =====
const skills = [
  {name:"academic-paper",category:"academic",tag:"research",tagLabel:"学术研究",desc:"12-agent 学术论文写作流水线。10 种模式（全文/计划/大纲/修订/摘要/文献综述/格式转换/引用检查/披露声明），6 种论文类型，5 种引用格式。支持中英双语摘要，输出 LaTeX/DOCX/PDF。",usage:"写学术论文、修订稿件、文献综述、格式转换、引用检查",solve:"解决学术写作全流程痛点，从构思到定稿一站式完成，包含写作质量检查与 AI 反模式标注",invoke:"/academic-paper",modes:"full / plan / outline / revision / revision-coach / abstract / lit-review / format-convert / citation-check / disclosure"},
  {name:"academic-paper-reviewer",category:"academic",tag:"research",tagLabel:"学术研究",desc:"专业学术论文审稿与评价。模拟同行评审流程，提供结构化审稿意见，包括方法论评估、论证逻辑检查、数据可靠性分析。",usage:"审阅论文稿件、回复审稿意见、投稿前自审",solve:"提供高质量的结构化审稿意见，帮助提升投稿成功率",invoke:"/academic-paper-reviewer"},
  {name:"academic-pipeline",category:"academic",tag:"research",tagLabel:"学术研究",desc:"学术研究工作流管线，将研究过程系统化：从选题、文献调研、实验设计到论文写作的端到端研究流程管理。",usage:"规划研究项目、系统化文献调研、实验设计辅助",solve:"解决研究过程碎片化问题，提供结构化的研究管理框架",invoke:"/academic-pipeline"},
  {name:"deep-research",category:"academic",tag:"research",tagLabel:"学术研究",desc:"全局深度研究 agent 团队。13-agent 流水线，7 种模式：完整研究/快速简报/论文审阅/文献综述/事实核查/苏格拉底引导式研究对话/系统综述与可选元分析。",usage:"深度研究、文献综述、系统综述、事实核查、元分析",solve:"将数周的研究工作压缩至数小时，遵循 PRISMA 等学术标准，自动进行交叉验证和偏倚风险评估",invoke:"/deep-research",modes:"full research / quick brief / paper review / lit-review / fact-check / Socratic guided research / systematic review with meta-analysis"},
  {name:"using-superpowers",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"Superpowers 工作流入门。建立技能发现与使用体系，在回复任何内容之前先调用 Skill 工具。",usage:"开始任何对话时自动触发",solve:"确保所有对话都优先使用已有技能，避免重复造轮子",invoke:"/using-superpowers"},
  {name:"brainstorming",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"在创建功能、构建组件、添加功能或修改行为之前进行需求头脑风暴。探索用户意图、需求和设计。",usage:"写代码之前先做需求分析",solve:"避免理解偏差导致返工，提前对齐需求与方案",invoke:"/brainstorming"},
  {name:"writing-plans",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"将需求/规格说明转化为多步骤实施计划。在动手编码之前完成架构设计。",usage:"有需求规格后进行实施规划",solve:"将模糊需求转化为可执行步骤",invoke:"/writing-plans"},
  {name:"executing-plans",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"按书面实施计划执行，在独立会话中完成带审查检查点的开发任务。",usage:"有已编写的实施计划时",solve:"分步执行复杂任务，每个检查点可验证、可回退",invoke:"/executing-plans"},
  {name:"test-driven-development",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"实现任何功能或 bug 修复前，先进行 TDD 红/绿/重构循环。先写测试，再写代码。",usage:"任何功能实现或 bug 修复前",solve:"先测试后代码，确保实现正确性",invoke:"/test-driven-development"},
  {name:"systematic-debugging",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"遇到 bug、测试失败或意外行为时，在提出修复之前进行系统化调试。",usage:"遇到任何 bug、测试失败",solve:"避免盲目猜测修复，通过系统化分析快速定位根因",invoke:"/systematic-debugging"},
  {name:"subagent-driven-development",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"在当前会话中执行包含独立任务的实施计划时使用子 Agent 协作。",usage:"实施计划中有多个独立任务时",solve:"并行处理独立任务，提高复杂项目的开发效率",invoke:"/subagent-driven-development"},
  {name:"dispatching-parallel-agents",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"面对 2 个以上互不依赖的任务时可以并行执行。",usage:"2+ 独立任务，无共享状态或顺序依赖",solve:"充分利用并行能力，大幅缩短多任务处理时间",invoke:"/dispatching-parallel-agents"},
  {name:"requesting-code-review",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"完成任务、实现重要功能或合并前，请求代码审查以验证工作是否满足需求。",usage:"功能完成、准备合并时",solve:"提交前进行系统化自审，减少 PR 往返修改",invoke:"/requesting-code-review"},
  {name:"receiving-code-review",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"收到代码审查反馈时，先进行技术严谨性检查，再实施建议。避免盲目接受。",usage:"收到 PR 审查意见时",solve:"过滤出有实质价值的建议，避免引入新问题",invoke:"/receiving-code-review"},
  {name:"verification-before-completion",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"在声称工作完成、修复完毕或测试通过前，运行验证命令并确认输出。先验证，再断言。",usage:"声称任何工作完成前",solve:"避免虚假断言，用证据代替猜测",invoke:"/verification-before-completion"},
  {name:"finishing-a-development-branch",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"实现完成、测试全部通过后，引导分支收尾工作：合并、PR 或清理。",usage:"开发完成、所有测试通过后",solve:"规范化分支收尾流程",invoke:"/finishing-a-development-branch"},
  {name:"using-git-worktrees",category:"superpowers",tag:"dev",tagLabel:"开发工作流",desc:"启动需要隔离工作的 feature 或执行实施计划前，确保有独立的工作空间。",usage:"需要工作空间隔离时",solve:"避免当前工作区被污染",invoke:"/using-git-worktrees"},

  {name:"pymc",category:"scientific",tag:"science",tagLabel:"科研计算",desc:"贝叶斯建模。层次模型、MCMC（NUTS）、变分推断、LOO/WAIC 模型比较、后验检验。",usage:"概率编程和贝叶斯统计建模",solve:"灵活的贝叶斯推断框架",invoke:"/pymc"}
];

// Append remaining scientific skills
const extras = "adaptyv,aeon,anndata,arboreto,astropy,autoskill,benchling-integration,bgpt-paper-search,bids,bioservices,cellxgene-census,cobrapy,datamol,deeptools,depmap,dhdna-profiler,diffdock,dnanexus-integration,esm,etetoolkit,exa-search,flowio,fluidsim,geniml,geomaster,geopandas,get-available-resources,gget,ginkgo-cloud-lab,glycoengineering,gtars,histolab,hugging-science,hypogenic,imaging-data-commons,infographics,labarchive-integration,lamindb,latchbio-integration,latex-posters,market-research-reports,matchms,matlab,matplotlib,medchem,modal,molfeat,networkx,neurokit2,neuropixels-analysis,omero-integration,open-notebook,opentrons-integration,optimize-for-gpu,pacsomatic,paper-lookup,paperzilla,parallel-web,pathml,phylogenetics,polars-bio,pptx-posters,primekg,protocolsio-integration,pufferlib,pydeseq2,pylabrobot,pymatgen,pymoo,pyopenms,pysam,pytdc,pyzotero,qutip,research-grants,research-lookup,rowan,scikit-bio,scikit-survival,scvelo,scvi-tools,seaborn,simpy,stable-baselines3,statistical-analysis,statsmodels,tiledbvcf,timesfm-forecasting,torch-geometric,torchdrug,transformers,treatment-plans,umap-learn,usfiscaldata,venue-templates,zarr-python".split(",");
extras.forEach(function(name){
  skills.push({name:name,category:"scientific",tag:"science",tagLabel:"科研计算",desc:"科研计算与分析技能",usage:"科学研究和数据分析",solve:"提供专业的科研计算能力",invoke:"/"+name});
});

// ===== RENDER =====
var currentTheme = 'light', activeCategory = 'all', searchQuery = '';
var categoryMap = {all:{label:'全部',count:skills.length},academic:{label:'学术研究',count:0},superpowers:{label:'开发工作流',count:0},hyperframes:{label:'视频制作',count:0},scientific:{label:'科研计算',count:0},preexisting:{label:'中文/工具',count:0}};
skills.forEach(function(s){if(categoryMap[s.category])categoryMap[s.category].count++;});

function renderStats(){
  var t=skills.length,a=skills.filter(function(s){return s.category==='academic'}).length,sp=skills.filter(function(s){return s.category==='superpowers'}).length,h=skills.filter(function(s){return s.category==='hyperframes'}).length,sc=skills.filter(function(s){return s.category==='scientific'}).length,pe=skills.filter(function(s){return s.category==='preexisting'}).length;
  document.getElementById('statsBar').innerHTML='<div class="stat"><div class="stat-num">'+t+'</div><div class="stat-label">技能总数</div></div><div class="stat"><div class="stat-num">'+sc+'</div><div class="stat-label">科研计算</div></div><div class="stat"><div class="stat-num">'+(a+sp)+'</div><div class="stat-label">学术 + 工作流</div></div><div class="stat"><div class="stat-num">'+h+'</div><div class="stat-label">视频制作</div></div><div class="stat"><div class="stat-num">'+pe+'</div><div class="stat-label">中文 / 工具</div></div>';
  document.getElementById('totalCount').textContent=t;
}
function renderCategories(){
  var h='';
  for(var k in categoryMap){var v=categoryMap[k];h+='<button class="cat-btn'+(activeCategory===k?' active':'')+'" onclick="filterCategory(\''+k+'\')">'+v.label+' <span class="cat-count">'+v.count+'</span></button>';}
  document.getElementById('categoryFilters').innerHTML=h;
}
// ===== RATING SYSTEM =====
var ratings = {};
var RATINGS_KEY = 'skills-catalog-ratings';
try { var saved = localStorage.getItem(RATINGS_KEY); if (saved) ratings = JSON.parse(saved); } catch(e) {}

function saveRatings() { localStorage.setItem(RATINGS_KEY, JSON.stringify(ratings)); }
function getRating(name) { return ratings[name] || { total: 0, count: 0, avg: 0 }; }
function rateSkill(name, val) {
  var r = ratings[name] || { total: 0, count: 0, avg: 0, userVote: 0 };
  if (r.userVote) return;
  r.total += val; r.count += 1; r.avg = Math.round((r.total / r.count) * 10) / 10; r.userVote = val;
  ratings[name] = r; saveRatings();
  renderSkills();
}
function renderStars(name) {
  var r = getRating(name), h = '';
  for (var i = 1; i <= 5; i++) {
    h += '<span class="star' + (i <= r.userVote ? ' active' : '') + '" onclick="event.stopPropagation();rateSkill(\'' + name + '\',' + i + ')" title="' + i + '星">★</span>';
  }
  return '<div class="stars">' + h + '</div>';
}
function renderRatingInfo(name) {
  var r = getRating(name);
  if (r.count === 0) return '<span class="rating-info">暂无评分</span>';
  return '<span class="rating-info"><strong>' + r.avg.toFixed(1) + '</strong> 分 · ' + r.count + ' 票</span>';
}

var currentSort = 'default';
function sortSkills(mode) { currentSort = mode; renderSkills(); }

function getFilteredSkills(){
  var filtered = skills.filter(function(s){
    var cat=activeCategory==='all'||s.category===activeCategory;
    var q=searchQuery.toLowerCase();
    var search=!q||s.name.toLowerCase().indexOf(q)!==-1||s.desc.toLowerCase().indexOf(q)!==-1||(s.usage||'').toLowerCase().indexOf(q)!==-1||(s.solve||'').toLowerCase().indexOf(q)!==-1;
    return cat&&search;
  });
  if (currentSort === 'rating') {
    filtered.sort(function(a,b){ return getRating(b.name).avg - getRating(a.name).avg; });
  } else if (currentSort === 'votes') {
    filtered.sort(function(a,b){ return getRating(b.name).count - getRating(a.name).count; });
  } else if (currentSort === 'name') {
    filtered.sort(function(a,b){ return a.name.localeCompare(b.name); });
  }
  return filtered;
}
function renderSkills(){
  var filtered=getFilteredSkills(),grid=document.getElementById('skillsGrid');
  if(!filtered.length){grid.innerHTML='<div class="empty-state"><div class="empty-icon">&#x1F50E;</div><h3>没有找到匹配的技能</h3><p>尝试不同的搜索词或切换分类</p></div>';return;}
  grid.innerHTML=filtered.map(function(s,i){return'<div class="skill-card" style="animation-delay:'+(i*0.02)+'s" onclick="openModal(\''+s.name+'\')"><div class="skill-header"><span class="skill-name">'+s.name+'</span><span class="skill-tag tag-'+s.tag+'">'+s.tagLabel+'</span></div><div class="skill-desc">'+s.desc+'</div><div class="skill-invoke">'+s.invoke+'</div><div class="skill-rating">'+renderStars(s.name)+renderRatingInfo(s.name)+'</div></div>';}).join('');
}
function filterCategory(cat){activeCategory=cat;renderCategories();renderSkills();}
function openModal(name){
  var s=skills.find(function(x){return x.name===name;});
  if(!s)return;
  var h='<div class="modal-header"><span class="modal-title">'+s.name+'</span><button class="modal-close" onclick="closeModal()">&#x2715;</button></div><div class="modal-body"><div class="modal-section"><span class="skill-tag tag-'+s.tag+'" style="margin-bottom:12px;display:inline-block;">'+s.tagLabel+'</span><p style="margin-top:8px;">'+s.desc+'</p></div><div class="modal-section"><h4>调用方式</h4><p><code>'+s.invoke+'</code></p>'+(s.triggers?'<p style="margin-top:8px;"><strong>触发词：</strong>'+s.triggers+'</p>':'')+(s.modes?'<p style="margin-top:8px;"><strong>可用模式：</strong>'+s.modes+'</p>':'')+'</div><div class="modal-section"><h4>使用场景</h4><p>'+s.usage+'</p></div><div class="modal-section"><h4>解决的问题</h4><p>'+s.solve+'</p></div><div class="modal-section"><h4>评分</h4><div class="skill-rating" style="border-top:none;padding-top:0;">'+renderStars(s.name)+renderRatingInfo(s.name)+'</div></div></div>';
  document.getElementById('modal').innerHTML=h;
  document.getElementById('modalOverlay').style.display='flex';
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modalOverlay').style.display='none';document.body.style.overflow='';}
function toggleTheme(){
  currentTheme=currentTheme==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',currentTheme);
  document.getElementById('themeToggle').textContent=currentTheme==='light'?'☾':'☀';
  localStorage.setItem('skills-catalog-theme',currentTheme);
}

window.addEventListener('DOMContentLoaded',function(){
  var saved=localStorage.getItem('skills-catalog-theme');
  if(saved==='dark'){currentTheme='dark';document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeToggle').textContent='☀';}
  renderStats();renderCategories();renderSkills();
  document.getElementById('searchInput').addEventListener('input',function(e){searchQuery=e.target.value;renderSkills();});
  document.getElementById('themeToggle').addEventListener('click',toggleTheme);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('searchInput').focus();}});
});
</script>
<script>
// ===== PARTICLE SYSTEM =====
(function(){
  var canvas=document.getElementById('particleCanvas'),ctx=canvas.getContext('2d');
  var particles=[],sparkles=[],shockRings=[],mouse={x:-1000,y:-1000,r:150},w,h,PARTICLE_COUNT=130,CONNECTION_DIST=160;
  function isDark(){return document.documentElement.getAttribute('data-theme')==='dark';}

  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize);

  var Particle=(function(){
    function P(){this.reset();this.y=Math.random()*h;this.x=Math.random()*w;}
    P.prototype.reset=function(){
      this.x=Math.random()*w;this.y=Math.random()*h;
      this.vx=(Math.random()-0.5)*0.4;this.vy=(Math.random()-0.5)*0.4;
      this.r=Math.random()*2.5+1;this.opacity=Math.random()*0.5+0.15;
      this.wobble=Math.random()*Math.PI*2;this.wobbleSpeed=(Math.random()-0.5)*0.01;
      this.wobbleAmp=Math.random()*0.4;
      this.hue=[220,260,290,330][Math.floor(Math.random()*4)];
    };
    P.prototype.update=function(){
      this.wobble+=this.wobbleSpeed;
      this.x+=this.vx+Math.sin(this.wobble)*this.wobbleAmp;
      this.y+=this.vy+Math.cos(this.wobble*0.7)*this.wobbleAmp;
      var dx=mouse.x-this.x,dy=mouse.y-this.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<mouse.r){var force=(mouse.r-dist)/mouse.r,angle=Math.atan2(dy,dx);this.x-=Math.cos(angle)*force*1.2;this.y-=Math.sin(angle)*force*1.2;}
      if(this.x<-20)this.x=w+20;if(this.x>w+20)this.x=-20;
      if(this.y<-20)this.y=h+20;if(this.y>h+20)this.y=-20;
    };
    P.prototype.draw=function(ctx){
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      var alpha=isDark()?this.opacity*0.7:this.opacity;
      ctx.fillStyle='hsla('+this.hue+', 60%, '+(isDark()?70:50)+'%, '+alpha+')';
      ctx.fill();
    };
    return P;
  })();

  var Sparkle=(function(){
    function S(x,y){
      this.x=x;this.y=y;
      var angle=Math.random()*Math.PI*2,speed=Math.random()*4+2;
      this.vx=Math.cos(angle)*speed;this.vy=Math.sin(angle)*speed;
      this.r=Math.random()*3+1.5;this.life=1;
      this.decay=Math.random()*0.015+0.008;
      this.hue=[200,240,280,320,340][Math.floor(Math.random()*5)];
      this.gravity=0.04;this.friction=0.98;
    }
    S.prototype.update=function(){
      this.vx*=this.friction;this.vy*=this.friction;this.vy+=this.gravity;
      this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;this.r*=0.995;
    };
    S.prototype.draw=function(ctx){
      var alpha=this.life*0.8;
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fillStyle='hsla('+this.hue+', 80%, '+(isDark()?75:55)+'%, '+alpha+')';
      ctx.fill();
      ctx.beginPath();ctx.arc(this.x,this.y,this.r*2.5,0,Math.PI*2);
      ctx.fillStyle='hsla('+this.hue+', 70%, '+(isDark()?70:50)+'%, '+(alpha*0.15)+')';
      ctx.fill();
    };
    Object.defineProperty(S.prototype,'dead',{get:function(){return this.life<=0;}});
    return S;
  })();

  var ShockRing=(function(){
    function R(x,y){this.x=x;this.y=y;this.r=2;this.maxR=80+Math.random()*40;this.life=1;this.decay=0.025;}
    R.prototype.update=function(){this.r+=(this.maxR-this.r)*0.15;this.life-=this.decay;};
    R.prototype.draw=function(ctx){
      var alpha=this.life*0.3;
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.strokeStyle='rgba('+(isDark()?'180,160,240':'140,120,210')+', '+alpha+')';
      ctx.lineWidth=1.5*this.life;ctx.stroke();
    };
    Object.defineProperty(R.prototype,'dead',{get:function(){return this.life<=0;}});
    return R;
  })();

  function spawnExplosion(x,y,count){
    for(var i=0;i<count;i++)sparkles.push(new Sparkle(x,y));
    shockRings.push(new ShockRing(x,y));
  }
  function drawMouseGlow(){
    if(mouse.x<-500)return;
    var g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,mouse.r);
    var c=isDark()?'160,180,255':'120,130,220';
    g.addColorStop(0,'rgba('+c+', 0.06)');g.addColorStop(0.5,'rgba('+c+', 0.03)');g.addColorStop(1,'rgba('+c+', 0)');
    ctx.fillStyle=g;ctx.fillRect(mouse.x-mouse.r,mouse.y-mouse.r,mouse.r*2,mouse.r*2);
  }
  function drawConnections(){
    var alpha=isDark()?0.06:0.08;
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<CONNECTION_DIST){
          var op=(1-dist/CONNECTION_DIST)*alpha;
          ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle='rgba('+(isDark()?'180,180,220':'120,130,200')+', '+op+')';
          ctx.lineWidth=0.5;ctx.stroke();
        }
      }
    }
  }
  function animate(){
    ctx.clearRect(0,0,w,h);drawMouseGlow();drawConnections();
    particles.forEach(function(p){p.update();p.draw(ctx);});
    sparkles.forEach(function(s){s.update();s.draw(ctx);});
    shockRings.forEach(function(r){r.update();r.draw(ctx);});
    sparkles=sparkles.filter(function(s){return !s.dead;});
    shockRings=shockRings.filter(function(r){return !r.dead;});
    requestAnimationFrame(animate);
  }

  document.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  document.addEventListener('mouseleave',function(){mouse.x=-1000;mouse.y=-1000;});
  document.addEventListener('click',function(e){
    if(e.target.closest('.skill-card, .cat-btn, button, input, .modal-overlay'))return;
    spawnExplosion(e.clientX,e.clientY,25+Math.floor(Math.random()*15));
  });
  document.addEventListener('touchmove',function(e){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',function(e){
    if(e.changedTouches.length===1&&!e.target.closest('.skill-card, .cat-btn, button, input')){
      var t=e.changedTouches[0];spawnExplosion(t.clientX,t.clientY,20);
    }
    mouse.x=-1000;mouse.y=-1000;
  });

  var observer=new MutationObserver(function(){for(var i=0;i<particles.length;i++)particles[i].reset();});
  observer.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  resize();
  for(var i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle());
  animate();
})();
</script>
